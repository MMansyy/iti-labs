<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <section id="task-1">
            <h1 class="mb-4 text-center">My Google Map</h1>
            <iframe id="map" src="https://www.google.com/maps/embed" width="100%" height="450" style="border:0;"
                allowfullscreen="" loading="lazy">
            </iframe>
            <button id="loc-btn" class="btn btn-primary mt-3 w-100">Get My Location</button>
        </section>
        <section id="task-2" class="my-5 d-flex flex-column justify-content-center gap-4">
            <div class="card p-4">
                <h2 class="mb-4 text-center">User Details Form</h2>
                <form id="user-form" class="mb-4">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                </form>
            </div>
            <div id="result" class="card">
                <div class="d-flex flex-column justify-content-center align-items-center p-4">
                    <h3 class="text-center">Users :</h3>
                    <ul id="user-list" class="list-group gap-3 w-100">
                    </ul>
                </div>
            </div>
        </section>
        <section id="task-3" class="my-5">
            <div class="card p-4">
                <h2 class="mb-4 text-center">Worker</h2>
                <button id="start-worker-1" class="btn btn-primary w-100 mb-3">Start Big Calc</button>
                <button id="start-worker-2" class="btn btn-secondary w-100">Fetching data</button>
            </div>
        </section>
    </div>

    <script src="js/task1.js"></script>
</body>

</html>
