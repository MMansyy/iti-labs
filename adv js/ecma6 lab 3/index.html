<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12">
                <h3 class="mb-4 text-center display-5">Enter name of the country</h3>
                <form id="countryForm" class="w-50 mx-auto">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="countryInput" placeholder="Country Name" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                </form>
            </div>
            <div class="col-12">
                <div class="row justify-content-center d-none my-3" id="resultSection">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
