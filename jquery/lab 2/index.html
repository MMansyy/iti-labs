<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Labs Merged</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
</head>

<body>
    <div style="width: 100%; margin-bottom: 50px;">
        <img id="car" src="12.gif" style="width: 300px; position: relative; left: 0px;" alt="Car">
        <p id="xValue">0</p>
    </div>

    <hr>

    <div class="slider-container" style="width: 80%; margin: 50px auto;">
        <div class="my-slider">
            <div><img src="1.jpg" alt="Slide 1" style="width:100%; height:300px; object-fit:cover;"></div>
            <div><img src="2.jpg" alt="Slide 2" style="width:100%; height:300px; object-fit:cover;"></div>
            <div><img src="3.jpg" alt="Slide 3" style="width:100%; height:300px; object-fit:cover;"></div>
            <div><img src="12.gif" alt="Slide 4" style="width:100%; height:300px; object-fit:contain;"></div>
        </div>
    </div>

    <hr>

    <div style="height: 50vh; display: flex; justify-content: center; align-items: center;">
        <img id="flower" src="1.jpg" style="width: 350px;" alt="Flower">
    </div>

    <hr>

    <div style="padding: 20px;">
        <h2>Droppables</h2>
        <div class="drag-container">
            <div id="black-hole">
                <span>Black Hole</span>
            </div>
            <div id="drag-me">
                <img src="https://upload.wikimedia.org/wikipedia/en/1/17/Bugs_Bunny.svg" alt="Bugs" style="width:100%">
                <p>Drag Me</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
