<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery Lab 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pt-5">
    <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ul>
    <div class="container text-center">

        <div class="d-flex justify-content-center gap-2 mb-4">
            <button id="btn-about" class="btn btn-pink shadow-sm">About</button>
            <button id="btn-gallery" class="btn btn-pink shadow-sm">Gallary</button>
            <button id="btn-services" class="btn btn-pink shadow-sm">Services</button>
            <button id="btn-complain" class="btn btn-pink shadow-sm">Complain</button>
        </div>

        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-body p-4">

                <div id="about" class="content-section">
                    <h4 class="mb-3">Story About snow man</h4>
                    <p class="text-muted">This is the about section content.</p>
                </div>

                <div id="gallery" class="content-section" style="display: none;">
                    <div class="d-flex justify-content-center align-items-center gap-4">
                        <img src="left.png" id="prevBtn" class="arrow-btn" alt="Previous">
                        <img src="1.jpg" id="mainImage" alt="Snowman">
                        <img src="right.png" id="nextBtn" class="arrow-btn" alt="Next">
                    </div>
                </div>

                <div id="services" class="content-section" style="display: none;">
                    <ul class="list-group">
                        <li class="list-group-item" style="background-color: #f48fb1; color: white;">Item * 1</li>
                        <li class="list-group-item" style="background-color: #f48fb1; color: white;">Item * 2</li>
                        <li class="list-group-item" style="background-color: #f48fb1; color: white;">Item * 3</li>
                    </ul>
                </div>

                <div id="complain" class="content-section" style="display: none;">

                    <div id="form-container" class="text-start">
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold">Name:</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control form-control-sm" id="nameInput">
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold">Email:</label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control form-control-sm" id="emailInput">
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold">Phone:</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control form-control-sm" id="phoneInput">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-bold">Complain:</label>
                            <div class="col-sm-9">
                                <textarea class="form-control form-control-sm" id="complainInput" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="text-center">
                            <button id="sendBtn" class="btn btn-outline-secondary btn-sm px-4">send</button>
                        </div>
                    </div>

                    <div id="preview-container" style="display: none;">
                        <p>Your complain is: <strong id="p-complain"></strong></p>
                        <p>Your name is: <strong id="p-name"></strong></p>
                        <p>Your email is: <strong id="p-email"></strong></p>
                        <p>Your phone is: <strong id="p-phone"></strong></p>
                        <button id="editBtn" class="btn btn-outline-secondary btn-sm mt-3 px-4">back to edit</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {

            $("#btn-about").click(function () {
                $(".content-section").hide();
                $("#about").fadeIn();
            });

            $("#btn-gallery").click(function () {
                $(".content-section").hide();
                $("#gallery").fadeIn();
            });

            $("#btn-services").click(function () {
                $(".content-section").not("#services").hide();

                $("#services").slideToggle();
            });

            $("#btn-complain").click(function () {
                $(".content-section").hide();
                $("#complain").fadeIn();
            });

            let currentImageNumber = 1;
            const totalImages = 8;

            $("#nextBtn").click(function () {
                currentImageNumber = (currentImageNumber % totalImages) + 1;
                $("#mainImage").attr("src", currentImageNumber + ".jpg");
            });

            $("#prevBtn").click(function () {
                currentImageNumber = currentImageNumber - 1;
                if (currentImageNumber < 1) currentImageNumber = totalImages;
                $("#mainImage").attr("src", currentImageNumber + ".jpg");
            });

            $("#sendBtn").click(function () {
                $("#p-name").text($("#nameInput").val());
                $("#p-email").text($("#emailInput").val());
                $("#p-phone").text($("#phoneInput").val());
                $("#p-complain").text($("#complainInput").val());

                $("#form-container").hide();
                $("#preview-container").fadeIn();
            });

            $("#editBtn").click(function () {
                $("#preview-container").hide();
                $("#form-container").fadeIn();
            });

        });
    </script>
    <script src="app.js"></script>
</body>

</html>
